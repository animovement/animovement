# Builds and deploys the pkgdown site. The workflow lives in
# animovement/.github so it is maintained in one place; only the triggers are
# declared here.
name: pkgdown

on:
  push:
    branches: [main]
  # Every pull request, whatever it targets. A stacked pull request has a base
  # of another branch, so `branches: [main]` skipped it -- and since pkgdown is
  # a required check, one that never runs blocks the merge for good. The
  # reusable workflow only deploys when the event is not a pull request, so
  # running here builds the site without publishing it.
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  pkgdown:
    uses: animovement/.github/.github/workflows/pkgdown.yml@main
    with:
      quarto: true
    permissions:
      contents: write
    secrets: inherit
