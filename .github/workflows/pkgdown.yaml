# Builds and deploys the pkgdown site. The workflow lives in
# animovement/.github so it is maintained in one place; only the triggers are
# declared here.
name: pkgdown

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  pkgdown:
    uses: animovement/.github/.github/workflows/pkgdown.yml@main
    with:
      quarto: true
    permissions:
      contents: write
    secrets: inherit
