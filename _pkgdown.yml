url: https://animovement.dev/animovement/

home:
  title: Analyse movement across space and time

# Theme, author details, and the shared navbar components (the animovement
# ecosystem dropdown + Zulip link) are inherited from animovementtemplate.
# This site documents the meta-package only; tutorials for analysing movement
# data live on the hub, which the Learn link below points at.
template:
  bootstrap: 5
  package: animovementtemplate

reference:
- title: "animovement"
  desc: These functions allow you to manage your animovement packages.
  contents:
  - animovement_detach
  - animovement_extend
  - animovement_conflicts
  - animovement_deps
  - animovement_repos
  - animovement_update
  - animovement_install
  - animovement_sitrep
  - animovement_packages
  - animovement_install_suggested
  - animovement_show_suggested


navbar:
  components:
    learn:
      icon: fa fa-graduation-cap
      text: Learn
      href: https://animovement.dev
      aria-label: Tutorials on animovement.dev
  structure:
    left:  [intro, articles, reference, news, learn]
